# 데모용으로 수집·평가 주기를 짧게 잡는다 (장애 주입 후 1분 안에 알림이 뜨도록)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: todo-app
    static_configs:
      - targets: ["fastapi-app:8000"]
        labels:
          service: todo-api

  - job_name: ops-agent       # 에이전트 KPI (MTTD·조사 시간·MTTR·RCA 적중률)
    static_configs:
      - targets: ["ops-agent:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
